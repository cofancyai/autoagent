<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkingAgent - AI Decision Making Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2E1A47 0%, #1a1a4e 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            z-index: 1;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .logo-text h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }

        .session-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .new-session-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a4e;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .new-session-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        /* Main layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: calc(100vh - 140px);
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* Chat panel */
        .chat-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 215, 0, 0.05);
        }

        .panel-header h2 {
            font-size: 20px;
            color: #FFD700;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.3);
            border-radius: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: messageSlideIn 0.3s ease;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            opacity: 0.7;
        }

        .message-role {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .message.user .message-role {
            background: rgba(100, 150, 255, 0.2);
            color: #6096ff;
        }

        .message.assistant .message-role {
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 12px;
            border-left: 3px solid;
            line-height: 1.6;
        }

        .message.user .message-content {
            border-left-color: #6096ff;
        }

        .message.assistant .message-content {
            border-left-color: #FFD700;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        #messageInput:focus {
            border-color: #FFD700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        #sendBtn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a4e;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Approval panel */
        .approval-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .approval-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            opacity: 0.5;
            gap: 15px;
        }

        .empty-state-icon {
            font-size: 64px;
        }

        .empty-state-text {
            font-size: 18px;
        }

        .approval-checkpoint {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .checkpoint-header {
            margin-bottom: 25px;
        }

        .checkpoint-title {
            font-size: 22px;
            margin-bottom: 10px;
            color: #FFD700;
        }

        .checkpoint-description {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-card:hover {
            border-color: rgba(255, 215, 0, 0.5);
            transform: translateX(5px);
        }

        .option-card.selected {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.15);
        }

        .option-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .option-name {
            font-size: 18px;
            font-weight: 600;
            color: #FFD700;
        }

        .recommended-badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a4e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .option-description {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .pros-cons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .pros, .cons {
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .pros {
            border-left: 3px solid #4ade80;
        }

        .cons {
            border-left: 3px solid #f87171;
        }

        .pros-cons h4 {
            font-size: 13px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .pros-cons ul {
            list-style: none;
            padding-left: 0;
        }

        .pros-cons li {
            font-size: 13px;
            margin-bottom: 6px;
            padding-left: 18px;
            position: relative;
            opacity: 0.8;
        }

        .pros li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #4ade80;
        }

        .cons li::before {
            content: '✗';
            position: absolute;
            left: 0;
            color: #f87171;
        }

        .decision-area {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
        }

        .decision-area h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #FFD700;
        }

        #modificationsInput {
            width: 100%;
            min-height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 15px;
        }

        #modificationsInput:focus {
            outline: none;
            border-color: #FFD700;
        }

        #submitDecisionBtn {
            width: 100%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a4e;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submitDecisionBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        #submitDecisionBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #FFD700;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Notifications */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
            z-index: 1000;
            max-width: 350px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .notification.error {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        .notification.info {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #FFD700;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        .loading-text {
            font-size: 18px;
            color: #FFD700;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .logo-text h1 {
                font-size: 24px;
            }

            .pros-cons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🧠</div>
                <div class="logo-text">
                    <h1>ThinkingAgent</h1>
                    <p>AI-Powered Decision Making Platform</p>
                </div>
            </div>
            <div class="session-info">
                <button class="new-session-btn" onclick="app.createNewSession()">
                    ✨ New Session
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Chat Panel -->
            <div class="chat-panel">
                <div class="panel-header">
                    <h2>💬 Conversation</h2>
                </div>
                <div class="messages-container" id="messagesContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">💭</div>
                        <div class="empty-state-text">Start a conversation to get strategic insights</div>
                    </div>
                </div>
                <div class="input-area">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="messageInput"
                            placeholder="Describe your goal or challenge..."
                            onkeypress="if(event.key === 'Enter') app.sendMessage()"
                        >
                        <button id="sendBtn" onclick="app.sendMessage()">Send</button>
                    </div>
                </div>
            </div>

            <!-- Approval Panel -->
            <div class="approval-panel">
                <div class="panel-header">
                    <h2>🎯 Strategic Options</h2>
                </div>
                <div class="approval-content" id="approvalContent">
                    <div class="empty-state">
                        <div class="empty-state-icon">🤔</div>
                        <div class="empty-state-text">AI will generate strategic options based on your message</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';

        class ThinkingAgentApp {
            constructor() {
                this.sessionId = null;
                this.currentApprovalId = null;
                this.selectedOption = null;
                this.messages = [];
            }

            async init() {
                await this.createNewSession();
            }

            async createNewSession() {
                this.showLoading('Creating new session...');
                try {
                    const response = await fetch(`${API_BASE_URL}/sessions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: 'New Session',
                            system_prompt: 'You are a strategic thinking assistant that helps users make better decisions.'
                        })
                    });

                    if (!response.ok) throw new Error('Failed to create session');

                    const data = await response.json();
                    this.sessionId = data.data.id;
                    this.messages = [];
                    this.clearMessages();
                    this.clearApproval();
                    this.showNotification('New session created successfully!', 'success');
                } catch (error) {
                    console.error('Error creating session:', error);
                    this.showNotification('Failed to create session. Please try again.', 'error');
                } finally {
                    this.hideLoading();
                }
            }

            async sendMessage() {
                const input = document.getElementById('messageInput');
                const content = input.value.trim();

                if (!content) return;
                if (!this.sessionId) {
                    this.showNotification('Please create a session first', 'error');
                    return;
                }

                const sendBtn = document.getElementById('sendBtn');
                sendBtn.disabled = true;
                sendBtn.innerHTML = '<span class="spinner"></span>';

                try {
                    // Add user message to UI
                    this.addMessage('user', content);
                    input.value = '';

                    // Send to backend
                    const response = await fetch(`${API_BASE_URL}/sessions/${this.sessionId}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            role: 'user',
                            content: content
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || 'Failed to send message');
                    }

                    const data = await response.json();
                    console.log('Message response:', data);

                    // Check if there's an approval checkpoint
                    if (data.data.approval_checkpoint) {
                        this.showNotification('AI is analyzing your request...', 'info');
                        // Fetch full approval details
                        await this.loadApprovalCheckpoint(data.data.approval_checkpoint.id);
                    }

                    // Check if there's an assistant message
                    if (data.data.message && data.data.message.role === 'assistant') {
                        // Will be loaded when we fetch messages
                    }

                    // Fetch latest messages to get assistant response
                    await this.loadMessages();

                } catch (error) {
                    console.error('Error sending message:', error);
                    this.showNotification(error.message || 'Failed to send message', 'error');
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Send';
                }
            }

            async loadMessages() {
                try {
                    const response = await fetch(`${API_BASE_URL}/sessions/${this.sessionId}/messages`);
                    if (!response.ok) throw new Error('Failed to load messages');

                    const data = await response.json();
                    const messages = data.data || [];

                    // Clear and re-render all messages
                    this.clearMessages();
                    messages.forEach(msg => {
                        this.addMessage(msg.role, msg.content, false);
                    });
                } catch (error) {
                    console.error('Error loading messages:', error);
                }
            }

            async loadApprovalCheckpoint(approvalId) {
                this.showLoading('Loading strategic options...');
                try {
                    const response = await fetch(`${API_BASE_URL}/approvals/${approvalId}`);
                    if (!response.ok) throw new Error('Failed to load approval checkpoint');

                    const data = await response.json();
                    const approval = data.data;

                    this.currentApprovalId = approvalId;
                    this.displayApprovalOptions(approval);
                    this.showNotification('Strategic options ready!', 'success');
                } catch (error) {
                    console.error('Error loading approval:', error);
                    this.showNotification('Failed to load options', 'error');
                } finally {
                    this.hideLoading();
                }
            }

            addMessage(role, content, scrollToBottom = true) {
                const container = document.getElementById('messagesContainer');

                // Remove empty state if exists
                const emptyState = container.querySelector('.empty-state');
                if (emptyState) emptyState.remove();

                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span class="message-role">${role === 'user' ? '👤 You' : '🤖 AI Assistant'}</span>
                        <span>${new Date().toLocaleTimeString()}</span>
                    </div>
                    <div class="message-content">${this.escapeHtml(content)}</div>
                `;

                container.appendChild(messageDiv);

                if (scrollToBottom) {
                    container.scrollTop = container.scrollHeight;
                }
            }

            displayApprovalOptions(approval) {
                const container = document.getElementById('approvalContent');

                const html = `
                    <div class="approval-checkpoint">
                        <div class="checkpoint-header">
                            <h3 class="checkpoint-title">📋 ${approval.checkpoint_type.replace('_', ' ').toUpperCase()}</h3>
                            <p class="checkpoint-description">${approval.decision_needed}</p>
                        </div>

                        <div class="options-grid">
                            ${approval.options.map((option, index) => `
                                <div class="option-card" onclick="app.selectOption(${index})" id="option-${index}">
                                    <div class="option-header">
                                        <div class="option-name">${option.name}</div>
                                        ${approval.recommended_option === index ?
                                            '<span class="recommended-badge">⭐ Recommended</span>' : ''}
                                    </div>
                                    ${option.description ? `<p class="option-description">${option.description}</p>` : ''}

                                    <div class="pros-cons">
                                        <div class="pros">
                                            <h4>✓ Pros</h4>
                                            <ul>
                                                ${option.pros.map(pro => `<li>${pro}</li>`).join('')}
                                            </ul>
                                        </div>
                                        <div class="cons">
                                            <h4>✗ Cons</h4>
                                            <ul>
                                                ${option.cons.map(con => `<li>${con}</li>`).join('')}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="decision-area">
                            <h3>✏️ Modifications or Notes (Optional)</h3>
                            <textarea
                                id="modificationsInput"
                                placeholder="Add any modifications or specific requirements..."
                            ></textarea>
                            <button id="submitDecisionBtn" onclick="app.submitDecision()" disabled>
                                Select an option above to proceed
                            </button>
                        </div>
                    </div>
                `;

                container.innerHTML = html;
                this.selectedOption = null;
            }

            selectOption(index) {
                // Remove previous selection
                document.querySelectorAll('.option-card').forEach(card => {
                    card.classList.remove('selected');
                });

                // Add selection to clicked option
                document.getElementById(`option-${index}`).classList.add('selected');

                this.selectedOption = index;

                // Enable submit button
                const submitBtn = document.getElementById('submitDecisionBtn');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Submit Decision';
            }

            async submitDecision() {
                if (this.selectedOption === null) {
                    this.showNotification('Please select an option first', 'error');
                    return;
                }

                const modifications = document.getElementById('modificationsInput').value.trim();
                const submitBtn = document.getElementById('submitDecisionBtn');

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> Submitting...';

                try {
                    const response = await fetch(`${API_BASE_URL}/approvals/${this.currentApprovalId}/decide`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            selected_option: this.selectedOption,
                            modifications: modifications || undefined
                        })
                    });

                    if (!response.ok) throw new Error('Failed to submit decision');

                    const data = await response.json();

                    this.showNotification('Decision submitted successfully! 🎉', 'success');
                    this.addMessage('assistant', `✅ Decision recorded! You selected option ${this.selectedOption + 1}${modifications ? '. Modifications: ' + modifications : ''}`);

                    // Clear approval panel
                    setTimeout(() => {
                        this.clearApproval();
                    }, 2000);

                } catch (error) {
                    console.error('Error submitting decision:', error);
                    this.showNotification('Failed to submit decision', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '✅ Submit Decision';
                }
            }

            clearMessages() {
                const container = document.getElementById('messagesContainer');
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💭</div>
                        <div class="empty-state-text">Start a conversation to get strategic insights</div>
                    </div>
                `;
            }

            clearApproval() {
                const container = document.getElementById('approvalContent');
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🤔</div>
                        <div class="empty-state-text">AI will generate strategic options based on your message</div>
                    </div>
                `;
                this.currentApprovalId = null;
                this.selectedOption = null;
            }

            showLoading(message = 'Loading...') {
                const overlay = document.createElement('div');
                overlay.className = 'loading-overlay';
                overlay.id = 'loadingOverlay';
                overlay.innerHTML = `
                    <div class="loading-content">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">${message}</div>
                    </div>
                `;
                document.body.appendChild(overlay);
            }

            hideLoading() {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) overlay.remove();
            }

            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.animation = 'slideIn 0.3s ease reverse';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize app
        const app = new ThinkingAgentApp();
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
